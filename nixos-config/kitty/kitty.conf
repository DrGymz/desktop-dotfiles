font_family GeistMono Nerd Font Mono
font_size 14
disable_ligatures yes
enable_audio_bell no
shell zsh
shell_integration disabled
cursor_shape beam
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.1
cursor_blink yes
url_style curly
remember_window_size no
background_opacity 0.80
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0
sync_to_monitor no

foreground          #ebdbb2
background          #282828
cursor              #ebdbb2
color0              #282828
color1              #cc241d
color2              #98971a
color3              #d79921
color4              #458588
color5              #b16286
color6              #689d6a
color7              #a89984
color8              #928374
color9              #fb4934
color10             #b8bb26
color11             #fabd2f
color12             #83a598
color13             #d3869b
color14             #8ec07c
color15             #ebdbb2
selection_foreground #282828
selection_background #d79921
