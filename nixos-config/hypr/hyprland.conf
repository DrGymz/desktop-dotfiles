general {
    gaps_in              = 4
    gaps_out             = 5
    border_size          = 1
    col.active_border    = rgba(000000ee)
    col.inactive_border  = rgba(000000ee)
    resize_on_border     = true
    allow_tearing        = false
    layout               = dwindle
}

decoration {
    rounding         = 20
    rounding_power   = 2
    active_opacity   = 1.0
    inactive_opacity = 0.7
    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }
    blur {
        enabled  = true
        size     = 5
        passes   = 3
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = b0,0,1,0,1.05
    bezier = b1,0,1.1,0,1.05
    animation = windows,1,4,b1,slide
    animation = windowsIn,1,4,b0,popin 88%
    animation = windowsOut,1,4,b0,slide
    animation = workspaces,1,3,default,slide
}

dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = true
}

ecosystem {
    no_update_news = true
}

xwayland {
    force_zero_scaling = true
}

monitor = eDP-1,3840x2400,auto,auto

exec-once = waybar
exec-once = waybar_auto_hide
exec-once = hyprpaper
exec-once = hypridle
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = asusctl leds set low
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

input {
    kb_layout      = us
    repeat_rate    = 35
    repeat_delay   = 200
    follow_mouse   = 1
    force_no_accel = true
    sensitivity    = 1.0
    touchpad {
        natural_scroll = false
    }
}

cursor {
    inactive_timeout    = 30
    no_hardware_cursors = true
}

gesture = 3, horizontal, workspace

$terminal    = kitty
$fileManager = nemo
$menu        = ~/.config/rofi/launchers/type-2/launcher.sh

bind = SUPER, Return, exec, $terminal
bind = SUPER, B,      exec, firefox
bind = SUPER, Q,      killactive,
bind = SUPER, M,      exit,
bind = SUPER, F,      exec, $fileManager
bind = SUPER, D,      exec, $menu || pkill rofi
bind = SUPER, R,      exec, pkill waybar; waybar
bind = SUPER, P,      pseudo,
bind = SUPER, J,      togglesplit,
bind = SUPER, V,      exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = SUPER SHIFT, S, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy

bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER,       S, togglespecialworkspace, magic

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up,   workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel = , XF86KbdLightOnOff,     exec, asusctl leds next

bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous

windowrule2 = suppress_event maximize, class:.*
windowrule2 = no_focus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
